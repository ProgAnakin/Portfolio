<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="color-scheme" content="light" />

    <!--
      This page loads nothing from anywhere else: no analytics, no tag manager,
      no font CDN, no embedded video. That is a security decision as much as a
      performance one — a third-party script is someone else's supply chain
      running with your visitors' trust — and it is what makes a policy this
      narrow possible. `frame-ancestors` is deliberately absent: a meta tag
      cannot carry it, and declaring it here only logs a warning in every
      visitor's console. The header in `vercel.json` has it, along with HSTS
      and the rest that only a header can set; this tag is the floor for hosts
      that cannot set headers at all, such as GitHub Pages.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/archivo-wdth-latin.woff2"
      crossorigin
    />
    <title>Costanzo Annichini | Sales, and software for people who sell</title>
    <meta
      name="description"
      content="Costanzo Annichini, Technology Consultant at Webidoo Store. €65,000 sold in his first eight months on a low-ticket shop floor, top seller at every point of sale he has worked. Builds software for people who sell. Open to sales, SDR and business development roles."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Costanzo Annichini | Sales, and software for people who sell" />
    <meta
      property="og:description"
      content="Technology Consultant at Webidoo Store. €65,000 in his first eight months, top seller at every point of sale. Open to sales, SDR and business development roles."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:locale" content="en" />
    <meta property="og:site_name" content="Costanzo Annichini" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Costanzo Annichini, Technology Consultant. Black title card with his name and four sales figures."
    />

    <!--
      A recruiter's first move is usually a search, not a link. This is the
      only structured thing on the page a search engine can lift straight into
      a knowledge panel, and it costs nothing to serve.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Costanzo Annichini",
        "jobTitle": "Technology Consultant",
        "worksFor": { "@type": "Organization", "name": "Webidoo Store" },
        "knowsLanguage": ["it", "pt", "en"],
        "sameAs": ["https://www.linkedin.com/in/costanzoannichini", "https://github.com/ProgAnakin"],
        "description": "Technology consultant and salesperson who builds the software the shop floor is missing. Co-founder of Kouci."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #ededeb; background: #0a0a0a">
        <h1>Costanzo Annichini</h1>
        <p>
          Technology consultant at Webidoo Store. I sell technology on a shop floor and build the
          software shop floors are missing. Find me on
          <a href="https://www.linkedin.com/in/costanzoannichini" style="color: #ededeb">LinkedIn</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
