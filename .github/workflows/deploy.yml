name: Deploy to GitHub Pages

# Run by hand, on purpose.
#
# Vercel serves this site and does it on every push. Pages would be a second
# copy of the same thing, and it cannot even start until someone ticks
# Settings → Pages → Source: GitHub Actions — `configure-pages` fails in one
# second until they do, and `enablement: true` could not do it for them
# either. A workflow that fails on every push of a portfolio repository is
# worse than no workflow: the red cross is the first thing a visitor sees.
#
# To publish to Pages as well: tick that setting, run this from the Actions
# tab, and if you want it automatic again put back
#   push:
# above, with the `if:` on the build job already filtering to the default
# branch by asking the event what the default branch is.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Audit runtime dependencies
        run: npm run audit:deps

      - name: Build
        env:
          # A project page is served from /<repo>/, so assets need that prefix.
          VITE_BASE: /${{ github.event.repository.name }}/
          # No `VITE_SITE_URL` override on purpose: a Pages build inherits the
          # Vercel address as its canonical, which is what it is — a mirror.
          # Two copies each claiming to be the original is how a small site
          # competes with itself in search results.
        run: npm run build

      - name: Single-page fallback
        # Pages has no rewrite rules; a copy of index.html at 404.html keeps
        # deep links working if routes are ever added.
        run: cp dist/index.html dist/404.html

      # `enablement` turns Pages on if it is off, using the `pages: write`
      # permission this job already holds. Without it the first run of a
      # repository that has never published stops here with "GitHub Pages is
      # not enabled", which is a settings checkbox reported as a build failure.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
