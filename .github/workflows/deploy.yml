name: Deploy to GitHub Pages

# Every push, filtered to the default branch by the job below rather than by
# name. This workflow spent its whole life listening for pushes to `main` in a
# repository that has no `main`: zero runs, and nothing to show it. Asking the
# event what the default branch *is* survives the rename to `main` as well.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Audit runtime dependencies
        run: npm run audit:deps

      - name: Build
        env:
          # A project page is served from /<repo>/, so assets need that prefix.
          VITE_BASE: /${{ github.event.repository.name }}/
          # The canonical link and the share image have to be absolute, and
          # this is the one place the origin is actually knowable. Without it
          # those tags are dropped rather than pointed at a guess.
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Single-page fallback
        # Pages has no rewrite rules; a copy of index.html at 404.html keeps
        # deep links working if routes are ever added.
        run: cp dist/index.html dist/404.html

      # `enablement` turns Pages on if it is off, using the `pages: write`
      # permission this job already holds. Without it the first run of a
      # repository that has never published stops here with "GitHub Pages is
      # not enabled", which is a settings checkbox reported as a build failure.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
